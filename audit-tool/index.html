<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Website Audit | EasyGoAI</title>

<style>

body{
background:#0a0a0f;
color:white;
font-family:Arial;
text-align:center;
padding:60px;
}

input{
padding:14px;
width:320px;
background:#111;
border:1px solid #333;
color:white;
border-radius:8px;
}

button{
padding:14px 20px;
background:#6366f1;
border:none;
border-radius:8px;
color:white;
margin-left:10px;
cursor:pointer;
}

#results{
margin-top:40px;
max-width:700px;
margin-left:auto;
margin-right:auto;
text-align:left;
}

.card{
background:#111;
padding:20px;
border-radius:8px;
margin-top:15px;
}

</style>

</head>

<body>

<h1>Free Website Audit</h1>

<p>Analyze basic SEO structure</p>

<input id="url" placeholder="https://example.com">

<button onclick="runAudit()">Audit Website</button>

<div id="results"></div>

<script>

async function runAudit(){

const url=document.getElementById("url").value;

const results=document.getElementById("results");

results.innerHTML="Running audit...";

try{

const response=await fetch("/api/audit",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({url})
});

const data=await response.json();

results.innerHTML=`

<div class="card">

<h3>SEO Score: ${data.seo_score}</h3>

Title: ${data.title}<br>
H1 Tags: ${data.h1_count}

</div>

<div class="card">

<h3>Recommendations</h3>

${data.recommendations.map(r=>"• "+r).join("<br>")}

</div>

`;

}catch(err){

results.innerHTML="Audit failed. Try another website.";

}

}

</script>

</body>

</html>
