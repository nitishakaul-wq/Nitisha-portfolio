<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Website Audit | EasyGoAI</title>

<style>

body{
font-family:Arial;
background:#0a0a0f;
color:white;
text-align:center;
padding:40px;
}

input{
padding:14px;
width:340px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:white;
}

button{
padding:14px 20px;
border:none;
background:#6366f1;
color:white;
border-radius:8px;
cursor:pointer;
margin-left:10px;
}

#results{
margin-top:40px;
max-width:800px;
margin:auto;
text-align:left;
}

.card{
background:#111;
padding:16px;
border-radius:8px;
margin-top:10px;
}

.score{
font-size:20px;
margin-bottom:10px;
}

.good{color:#22c55e}
.ok{color:#f59e0b}
.bad{color:#ef4444}

</style>

</head>

<body>

<h1>Free Website Audit</h1>

<p>Analyze SEO structure and technical health</p>

<input id="url" placeholder="https://example.com">

<button onclick="runAudit()">Audit Website</button>

<div id="results"></div>

<script>

function color(score){

if(score>=80) return "good"
if(score>=60) return "ok"
return "bad"

}

async function runAudit(){

const url=document.getElementById("url").value

const results=document.getElementById("results")

results.innerHTML="Scanning website..."

try{

const res=await fetch("/api/audit",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({url})
})

const data=await res.json()

results.innerHTML=`

<div class="card">

<div class="score ${color(data.seo_score)}">
SEO Score: ${data.seo_score}
</div>

<div class="score ${color(data.overall_score)}">
Overall Score: ${data.overall_score}
</div>

</div>

<div class="card">

<b>Technical Checks</b><br><br>

Title: ${data.title}<br>

H1 tags: ${data.h1_count}<br>

Images: ${data.images}<br>

Images missing alt: ${data.missing_alt}<br>

Load time: ${data.load_time} ms<br>

Robots.txt: ${data.robots ? "Detected ✔" : "Missing ❌"}<br>

Sitemap.xml: ${data.sitemap ? "Detected ✔" : "Missing ❌"}

</div>

<div class="card">

<b>Recommendations</b><br><br>

${data.recommendations.map(r=>`• ${r}<br>`).join("")}

</div>

`

}catch(e){

results.innerHTML="Audit failed. Try another website."

}

}

</script>

</body>
</html>
