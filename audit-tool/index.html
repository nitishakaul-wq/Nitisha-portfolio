<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Website Audit Tool | EasyGoAI</title>
  <meta name="description" content="Free AI-powered website audit tool. Get instant insights on SEO, speed, design, and mobile-friendliness of any website.">
  <link rel="canonical" href="https://services.easygoaitool.online/audit-tool/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: #0a0a0f;
      color: #f1f1f4;
      line-height: 1.6;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .logo {
      font-weight: 600;
      font-size: 18px;
    }

    .nav-links a {
      color: #e2e2e8;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #6366f1;
    }

    header {
      text-align: center;
      padding: 60px 20px;
    }

    header h1 {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      margin-bottom: 10px;
    }

    header strong {
      color: #6366f1;
    }

    .tagline {
      color: #a1a1aa;
      max-width: 620px;
      margin: auto;
      margin-bottom: 25px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .audit-container {
      background: #14141c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 40px;
      margin-bottom: 40px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="url"] {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f0f16;
      color: white;
      font-size: 14px;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    button:hover {
      background: #4f46e5;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
      transform: none;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a1a1aa;
      font-size: 14px;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(99, 102, 241, 0.3);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .results {
      display: none;
    }

    .results.show {
      display: block;
      animation: slideIn 0.4s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .score-card {
      background: #0f0f16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .score-value {
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #6366f1;
    }

    .score-value.good { color: #10b981; }
    .score-value.fair { color: #f59e0b; }
    .score-value.poor { color: #ef4444; }

    .score-label {
      font-size: 13px;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .recommendations {
      background: #0f0f16;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .recommendations h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 20px;
      margin-bottom: 15px;
      color: #f1f1f4;
    }

    .rec-item {
      padding: 12px;
      margin-bottom: 10px;
      border-left: 3px solid #6366f1;
      background: rgba(99, 102, 241, 0.05);
      border-radius: 4px;
      font-size: 14px;
    }

    .lead-magnet {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      margin-bottom: 30px;
    }

    .lead-magnet h3 {
      font-family: 'Instrument Serif', serif;
      font-size: 24px;
      margin-bottom: 10px;
      color: white;
    }

    .lead-magnet p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 20px;
    }

    .lead-form {
      display: grid;
      gap: 10px;
      max-width: 350px;
      margin: auto;
    }

    .lead-form input,
    .lead-form textarea {
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: white;
      color: #1f2937;
      font-size: 14px;
    }

    .lead-form input::placeholder,
    .lead-form textarea::placeholder {
      color: #9ca3af;
    }

    .lead-form button {
      background: #1f2937;
      color: white;
      margin-top: 10px;
    }

    .lead-form button:hover {
      background: #111827;
    }

    .error {
      background: #fef2f2;
      color: #991b1b;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #dc2626;
      margin-bottom: 20px;
      display: none;
    }

    .error.show {
      display: block;
    }

    .success {
      background: #f0fdf4;
      color: #166534;
      padding: 16px;
      border-radius: 8px;
      border-left: 4px solid #22c55e;
      margin-bottom: 20px;
      display: none;
    }

    .success.show {
      display: block;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #9ca3af;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 14px;
    }

    footer a {
      color: #6366f1;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      nav {
        padding: 16px 20px;
      }

      header h1 {
        font-size: 32px;
      }

      .audit-container {
        padding: 24px;
      }

      .input-group {
        flex-direction: column;
      }

      .score-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="logo">EasyGoAI</div>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/#services">Services</a>
      <a href="/#pricing">Pricing</a>
      <a href="/#contact">Contact</a>
    </div>
  </nav>

  <header>
    <h1>Free AI <strong>Website Audit</strong></h1>
    <p class="tagline">Get instant AI-powered insights on your website's SEO, performance, design quality, and mobile-friendliness.</p>
  </header>

  <main>
    <div class="audit-container">
      <div class="input-group">
        <input
          type="url"
          id="websiteUrl"
          placeholder="Enter your website URL (e.g., https://example.com)"
          value="https://"
        >
        <button id="auditBtn" onclick="startAudit()">Audit Website</button>
      </div>
      <div id="error" class="error"></div>
      <div id="loading" class="loading" style="display: none;">
        <div class="spinner"></div>
        <span>Analyzing your website...</span>
      </div>
    </div>

    <div id="results" class="results"></div>
  </main>

  <footer>
    <p>© 2026 EasyGoAI</p>
    <p><a href="/">Back to Home</a></p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://0ec90b57d6e95fcbda19832f.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJib2x0IiwicmVmIjoiMGVjOTBiNTdkNmU5NWZjYmRhMTk4MzJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4ODE1NzQsImV4cCI6MTc1ODg4MTU3NH0.9I8-U0x86Ak8t2DGaIk0HfvTSLsAyzdnz-Nw00mMkKw';
    const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/audit-website`;

    async function startAudit() {
      const url = document.getElementById('websiteUrl').value.trim();
      const btn = document.getElementById('auditBtn');
      const errorDiv = document.getElementById('error');
      const loadingDiv = document.getElementById('loading');
      const resultsDiv = document.getElementById('results');

      errorDiv.classList.remove('show');
      errorDiv.textContent = '';

      if (!url || !url.startsWith('http')) {
        errorDiv.textContent = 'Please enter a valid website URL starting with http:// or https://';
        errorDiv.classList.add('show');
        return;
      }

      btn.disabled = true;
      loadingDiv.style.display = 'flex';
      resultsDiv.classList.remove('show');

      try {
        const response = await fetch(EDGE_FUNCTION_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_KEY}`,
          },
          body: JSON.stringify({ url })
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        displayResults(data);
      } catch (error) {
        errorDiv.textContent = `Error analyzing website: ${error.message}. Please try again.`;
        errorDiv.classList.add('show');
      } finally {
        btn.disabled = false;
        loadingDiv.style.display = 'none';
      }
    }

    function displayResults(data) {
      const resultsDiv = document.getElementById('results');

      const getScoreColor = (score) => {
        if (score >= 75) return 'good';
        if (score >= 50) return 'fair';
        return 'poor';
      };

      let html = `
        <div class="score-grid">
          <div class="score-card">
            <div class="score-value ${getScoreColor(data.seo_score)}">${data.seo_score}</div>
            <div class="score-label">SEO Score</div>
          </div>
          <div class="score-card">
            <div class="score-value ${getScoreColor(data.speed_score)}">${data.speed_score}</div>
            <div class="score-label">Speed Score</div>
          </div>
          <div class="score-card">
            <div class="score-value ${getScoreColor(data.design_score)}">${data.design_score}</div>
            <div class="score-label">Design Score</div>
          </div>
          <div class="score-card">
            <div class="score-value ${getScoreColor(data.overall_score)}">${data.overall_score}</div>
            <div class="score-label">Overall Score</div>
          </div>
        </div>
      `;

      if (data.recommendations && data.recommendations.length > 0) {
        html += `
          <div class="recommendations">
            <h3>Key Recommendations</h3>
            ${data.recommendations.map(rec => `<div class="rec-item">• ${rec}</div>`).join('')}
          </div>
        `;
      }

      html += `
        <div class="lead-magnet">
          <h3>Get Personalized Website Insights</h3>
          <p>Want detailed recommendations tailored to your business? Share your details and we'll send a comprehensive analysis to your email.</p>
          <form class="lead-form" onsubmit="submitLead(event, '${data.url}')">
            <input type="text" name="business_name" placeholder="Business Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <input type="tel" name="phone" placeholder="Phone (Optional)">
            <textarea name="message" placeholder="Tell us about your business (Optional)" rows="3"></textarea>
            <button type="submit">Get Full Audit Report</button>
          </form>
        </div>
      `;

      resultsDiv.innerHTML = html;
      resultsDiv.classList.add('show');
    }

    async function submitLead(event, auditUrl) {
      event.preventDefault();
      const form = event.target;
      const formData = new FormData(form);

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/capture-lead`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_KEY}`,
          },
          body: JSON.stringify({
            business_name: formData.get('business_name'),
            email: formData.get('email'),
            phone: formData.get('phone'),
            message: formData.get('message'),
            website_url: auditUrl
          })
        });

        if (response.ok) {
          const successDiv = document.createElement('div');
          successDiv.className = 'success show';
          successDiv.textContent = 'Thanks! We\'ll send you detailed insights to your email soon.';
          form.parentElement.insertBefore(successDiv, form);
          form.reset();
        } else {
          throw new Error('Failed to submit');
        }
      } catch (error) {
        alert('Error submitting form. Please try again.');
      }
    }

    document.getElementById('websiteUrl').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') startAudit();
    });
  </script>
</body>
</html>
