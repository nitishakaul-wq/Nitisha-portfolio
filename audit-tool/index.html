<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Website Audit | EasyGoAI</title>
  <style>
    body {
      background: #0a0a0f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 60px;
    }
    input {
      padding: 14px;
      width: 320px;
      background: #111;
      border: 1px solid #333;
      color: white;
      border-radius: 8px;
    }
    button {
      padding: 14px 20px;
      background: #6366f1;
      border: none;
      border-radius: 8px;
      color: white;
      margin-left: 10px;
      cursor: pointer;
    }
    #results {
      margin-top: 40px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
      text-align: left;
    }
    .card {
      background: #111;
      padding: 20px;
      border-radius: 8px;
      margin-top: 15px;
    }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <h1>Free Website Audit</h1>
  <p>Analyze basic SEO structure</p>
  <input id="url" placeholder="https://example.com" type="text">
  <button type="button" onclick="runAudit()">Audit Website</button>
  <div id="results"></div>

  <script>
    async function runAudit() {
      const urlInput = document.getElementById("url");
      const url = (urlInput && urlInput.value) ? urlInput.value.trim() : "";
      const resultsEl = document.getElementById("results");
      if (!resultsEl) return;

      resultsEl.innerHTML = "Running audit...";

      try {
        const response = await fetch("/api/audit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: url }),
        });

        let data;
        try {
          data = await response.json();
        } catch (e) {
          resultsEl.innerHTML =
            '<p class="error">Invalid response from server. Try again later.</p>';
          return;
        }

        if (!response.ok) {
          const msg =
            (data && data.error) ||
            `Request failed (${response.status}). Try another website.`;
          resultsEl.innerHTML = '<p class="error">' + escapeHtml(msg) + "</p>";
          return;
        }

        const score = data.seo_score != null ? data.seo_score : 0;
        const title = data.title != null ? escapeHtml(String(data.title)) : "—";
        const h1Count = data.h1_count != null ? data.h1_count : 0;
        const recommendations = Array.isArray(data.recommendations)
          ? data.recommendations
          : [];

        resultsEl.innerHTML =
          '<div class="card">' +
          "<h3>SEO Score: " + score + "</h3>" +
          "Title: " + title + "<br>" +
          "H1 Tags: " + h1Count +
          "</div>" +
          '<div class="card">' +
          "<h3>Recommendations</h3>" +
          (recommendations.length
            ? recommendations.map(function (r) { return "• " + escapeHtml(String(r)); }).join("<br>")
            : "No recommendations.") +
          "</div>";
      } catch (err) {
        console.error(err);
        resultsEl.innerHTML =
          '<p class="error">Audit failed. Check the URL or try another website.</p>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
